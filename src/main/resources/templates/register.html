<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | StudyFlow</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <div class="brand-mark">S</div>
    <p class="eyebrow">STUDYFLOW</p>
    <h1>Create your account</h1>
    <p class="muted">A calmer way to manage your assignments.</p>
    <div class="alert" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/register}" method="post" class="form-stack">
        <label>Full name<input type="text" name="name" maxlength="80" placeholder="Your name" th:value="${name}" required autocomplete="name"></label>
        <label>Email address<input type="email" name="email" maxlength="160" placeholder="you@example.com" th:value="${email}" required autocomplete="email"></label>
        <label>Password <span class="hint">(at least 8 characters)</span><input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"></label>
        <label>Confirm password<input type="password" name="confirmPassword" minlength="8" maxlength="72" required autocomplete="new-password"></label>
        <button class="button primary full" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already registered? <a th:href="@{/login}">Log in</a></p>
</div>
</body></html>
